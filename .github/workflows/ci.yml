name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Python dependencies
        working-directory: taxgraph-prozesspilot
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        working-directory: taxgraph-prozesspilot
        run: python -m pytest -q

      - name: Check browser JavaScript syntax
        working-directory: taxgraph-prozesspilot
        run: |
          node --check app/static/app.js
          node --check app/static/audit-data.js
          node --check app/static/graph-view.js

      - name: Check local startup script syntax
        working-directory: taxgraph-prozesspilot
        run: sh -n start-lokal.sh
