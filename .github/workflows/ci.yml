name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture exact source snapshot
        run: |
          mkdir -p verification
          git archive --format=zip HEAD -o verification/source.zip
          git rev-parse HEAD > verification/commit.txt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Python dependencies
        working-directory: taxgraph-prozesspilot
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        working-directory: taxgraph-prozesspilot
        run: python -m pytest -q --junitxml=../verification/tests.xml

      - name: Check browser JavaScript syntax
        working-directory: taxgraph-prozesspilot
        run: |
          for file in app/static/*.js; do node --check "$file"; done

      - name: Check local startup script syntax
        working-directory: taxgraph-prozesspilot
        run: sh -n start-lokal.sh

      - name: Retain reproducibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}
          path: verification/
          retention-days: 7
          if-no-files-found: error
